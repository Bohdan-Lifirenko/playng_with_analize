<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/style.css">

</head>
<body>
<!-- Company Information Card -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0">
                    <i class="bi bi-info-circle-fill"></i> Company Information
                </h4>
            </div>
            <div class="card-body p-4">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="info-item mb-3">
                            <label class="text-muted small mb-1">
                                <i class="bi bi-building"></i> Company Name
                            </label>
                            <p class="mb-0 fw-bold">{{ company.name }}</p>
                        </div>
                        <div class="info-item mb-3">
                            <label class="text-muted small mb-1">
                                <i class="bi bi-card-text"></i> EDRPOU (Tax ID)
                            </label>
                            <p class="mb-0 fw-bold font-monospace">{{ company.tax_id }}</p>
                        </div>
                        <div class="info-item mb-3">
                            <label class="text-muted small mb-1">
                                <i class="bi bi-diagram-3"></i> KVED (Economic Activity Code)
                            </label>
                            <p class="mb-0">{{ company.kved }}</p>
                        </div>
                        <div class="info-item">
                            <label class="text-muted small mb-1">
                                <i class="bi bi-briefcase"></i> Organizational Form Code
                            </label>
                            <p class="mb-0">{{ company.opf_code }}</p>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="info-item mb-3">
                            <label class="text-muted small mb-1">
                                <i class="bi bi-geo-alt"></i> KATOTTG Code
                            </label>
                            <p class="mb-0">{{ company.katottg }}</p>
                        </div>
                        <div class="info-item mb-3">
                            <label class="text-muted small mb-1">
                                <i class="bi bi-map"></i> Region Code
                            </label>
                            <p class="mb-0">{{ company.region_code }}</p>
                        </div>
                        <div class="info-item">
                            <label class="text-muted small mb-1">
                                <i class="bi bi-pin-map"></i> Local Code
                            </label>
                            <p class="mb-0">{{ company.local_code }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</body>
</html>
