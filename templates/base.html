<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Аналітика фінансових показників{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    {% block head %}{% endblock %}
</head>

<body class="bg-light">

<header class="bg-white border-bottom py-3 mb-4">
    <div class="container">
        <h1 class="h4 m-0">
            {% block header_title %}
                Фінансова аналітика за датою
            {% endblock %}
        </h1>
    </div>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted py-3 mt-4">
    Дані наведено для аналітичних та навчальних цілей
</footer>

{% block scripts %}{% endblock %}

</body>
</html>
