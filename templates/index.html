<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Аналітика фінансових показників</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body class="bg-light">

<header class="bg-white border-bottom py-3 mb-4">
    <div class="container">
        <h1 class="h4 m-0">Фінансова аналітика за датою</h1>
    </div>
</header>

<main class="container">

    <!-- Фільтр -->
    <div class="card mb-4 p-3">
        <label for="dateSelect" class="form-label">Оберіть дату</label>
        <select id="dateSelect" class="form-select"></select>
        <div class="form-text">
            Дані показані з початку періоду до обраної дати
        </div>
    </div>

    <!-- Графіки -->
    <div class="row g-4">
        <div class="col-12">
            <div class="card p-3">
                <div id="chartRevenue"></div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3">
                <div id="chartProfit"></div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3">
                <div id="chartExpenses"></div>
            </div>
        </div>
    </div>

</main>

<footer class="text-center text-muted py-3 mt-4">
    Дані наведено для аналітичних та навчальних цілей
</footer>

<script>
    window.APP_CONFIG = {
        dates: {{ dates | tojson }}
    };
</script>

<script src="{{ url_for('static', filename='js/chart.js') }}"></script>
</body>
</html>
