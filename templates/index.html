<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Аналітика фінансових показників</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body class="bg-light text-dark">

<header class="bg-white border-bottom py-3 mb-4">
    <div class="container">
        <h1 class="h4 m-0">Аналітика фінансових показників</h1>
    </div>
</header>

<main class="container">

    <!-- Фільтри -->
    <div class="card mb-4 p-3">
        <div class="mb-3">
            <label for="dateSelect" class="form-label">Оберіть дату</label>
            <select id="dateSelect" class="form-select" aria-describedby="dateHint"></select>
            <div id="dateHint" class="form-text">
                Показані дані від початку періоду до обраної дати
            </div>
        </div>
    </div>

    <!-- Графік -->
    <div class="card p-3">
        <div id="chart"></div>
    </div>

</main>

<footer class="text-center text-muted py-3">
    Дані наведено для аналітичних та навчальних цілей
</footer>

<!-- Дані з Flask -->
<script>
    window.APP_CONFIG = {
        dates: {{ dates | tojson }}
    };
</script>

<!-- Логіка графіка -->
<script src="{{ url_for('static', filename='js/chart.js') }}"></script>

<!-- Bootstrap JS (необов’язково, потрібен для деяких компонентів) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
