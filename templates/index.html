<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Аналітика показників за датою</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <!-- Стилі -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>

<header>
    <h1>Аналітика показників у часовому розрізі</h1>
</header>

<main>

    <!-- Фільтри -->
    <section class="controls" aria-label="Фільтри даних">
        <div class="control-group">
            <label for="dateSelect">Дата для аналізу</label>
            <select id="dateSelect" aria-describedby="dateHint"></select>
            <div class="hint" id="dateHint">
                Дані відображаються з початку періоду до обраної дати
            </div>
        </div>
    </section>

    <!-- Графік -->
    <section class="chart-container" aria-label="Графік динаміки">
        <div id="chart"></div>
    </section>

</main>

<footer>
    Дані наведено для аналітичних та навчальних цілей
</footer>

<!-- Дані з Flask -->
<script>
    window.APP_CONFIG = {
        dates: {{ dates | tojson }}
    };
</script>

<!-- Логіка графіка -->
<script src="{{ url_for('static', filename='js/chart.js') }}"></script>

</body>
</html>
