<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Аналітика фінансових показників</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Plotly -->
<!--    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>-->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body class="bg-light">

<header class="bg-white border-bottom py-3 mb-4">
    <div class="container">
        <h1 class="h4 m-0">Фінансова аналітика за датою</h1>
    </div>
</header>

<main class="container">
    <!-- Графіки -->
    <div class="row g-4">
        <div class="col-12">
            <div class="card p-3">
                <div id="revenueChart"></div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3">
                <div id="balanceChart"></div>
            </div>
        </div>
    </div>

</main>

<footer class="text-center text-muted py-3 mt-4">
    Дані наведено для аналітичних та навчальних цілей
</footer>

<script>
    window.APP_CONFIG = {
        company: {{ company | tojson }}
    };
</script>

<script src="{{ url_for('static', filename='js/chart.js') }}"></script>
</body>
</html>
