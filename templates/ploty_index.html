<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Company Info with Plotly</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Plotly JS -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- Optional: ваш CSS для картки -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/company-card.css') }}">
</head>
<body class="bg-light">

<div class="container py-5">

    <!-- Company Card -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0"><i class="bi bi-info-circle-fill"></i> Company Information</h4>
                </div>
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="info-item mb-3">
                                <label class="text-muted small mb-1"><i class="bi bi-building"></i> Company Name</label>
                                <p class="mb-0 fw-bold">{{ company.name }}</p>
                            </div>
                            <div class="info-item mb-3">
                                <label class="text-muted small mb-1"><i class="bi bi-card-text"></i> EDRPOU (Tax ID)</label>
                                <p class="mb-0 fw-bold font-monospace">{{ company.tax_id }}</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="info-item mb-3">
                                <label class="text-muted small mb-1"><i class="bi bi-diagram-3"></i> KVED</label>
                                <p class="mb-0">{{ company.kved }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Plotly Graph -->
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-secondary text-white py-3">
                    <h5 class="mb-0"><i class="bi bi-bar-chart-fill"></i> Comparison Chart</h5>
                </div>
                <div class="card-body p-4">
                    <div id="plotly-div"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    var graphs = {{ graphJSON | safe }};
    Plotly.newPlot('plotly-div', graphs.data, graphs.layout, {responsive: true});
</script>

</body>
</html>
